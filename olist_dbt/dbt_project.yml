# Dự án dbt của nhóm: biến đổi dữ liệu thô trong DuckDB thành kho dữ liệu.
name: olist_dbt
version: '1.0.0'
config-version: 2
profile: olist_dbt          # tên kết nối, khai báo trong profiles.yml

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

flags:
  send_anonymous_usage_stats: false   # không gửi thống kê sử dụng cho dbt Labs

vars:
  batch_id: null                # rỗng = tính lại mọi đơn; khi nạp tăng thêm thì truyền mã batch
  payment_threshold_brl: 0.01   # lệch thanh toán quá ngưỡng này (BRL) thì gắn cờ

models:
  olist_dbt:
    staging:                # models/staging/*: làm sạch từng bảng nguồn
      +schema: staging
      +materialized: view   # view: không lưu dữ liệu, mỗi lần đọc thì tính lại từ bảng thô
    intermediate:           # models/intermediate/*: tính toán trung gian theo nghiệp vụ
      +schema: intermediate
      +materialized: table  # table: lưu kết quả thành bảng, phải chạy lại dbt khi dữ liệu đổi
    marts:                  # models/marts/*: kho dữ liệu (khoá, dimension, fact)
      +schema: dwh
      +materialized: table

seeds:
  olist_dbt:                # seeds/*.csv: bảng tra cứu nhỏ do nhóm tự định nghĩa (trạng thái đơn, nhóm kết quả giao)
    +schema: dwh
